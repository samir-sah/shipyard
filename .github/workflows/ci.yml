name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: docker compose config --quiet

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start development infrastructure
        run: npm run setup
      - name: Start development services
        run: docker compose up -d --wait postgres redis storage
      - name: Build platform and builder images
        run: docker compose --profile tools build
      - name: Run PostgreSQL and S3 integration tests
        run: npm run test:integration
        env:
          RUN_INTEGRATION: '1'
          RUN_DOCKER_TESTS: '1'
      - name: Start platform API and worker
        run: docker compose up -d --wait api worker
      - name: Check API readiness and platform services
        run: |
          curl --retry 20 --retry-delay 2 --retry-all-errors --max-time 10 --fail http://localhost:3000/health
          docker compose ps
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop development infrastructure
        if: always()
        run: docker compose down -v
