name: shipyard

x-platform-environment: &platform-environment
  DATABASE_URL: postgres://shipyard:${POSTGRES_PASSWORD:-shipyard-local}@postgres:5432/shipyard
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://storage:8333
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-shipyard-artifacts}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-shipyard-local}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-shipyard-local-secret}
  BUILD_IMAGE: ${BUILD_IMAGE:-shipyard-builder:local}
  BUILD_TIMEOUT_MS: ${BUILD_TIMEOUT_MS:-300000}
  BUILD_CPUS: ${BUILD_CPUS:-1}
  BUILD_MEMORY_MB: ${BUILD_MEMORY_MB:-512}
  BUILD_PIDS: ${BUILD_PIDS:-128}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
  WORKER_LEASE_MS: ${WORKER_LEASE_MS:-30000}
  MAX_BUILD_ATTEMPTS: ${MAX_BUILD_ATTEMPTS:-3}
  MAX_ARTIFACT_BYTES: ${MAX_ARTIFACT_BYTES:-67108864}
  MAX_ARTIFACT_FILES: ${MAX_ARTIFACT_FILES:-5000}
  MAX_LOG_BYTES: ${MAX_LOG_BYTES:-1048576}
  RETENTION_DAYS: ${RETENTION_DAYS:-0}
  RETENTION_KEEP: ${RETENTION_KEEP:-5}

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: shipyard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shipyard-local}
      POSTGRES_DB: shipyard
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipyard -d shipyard"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.2.11-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  storage:
    image: chrislusf/seaweedfs:4.51
    command: ["mini", "-dir=/data", "-ip.bind=0.0.0.0"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-shipyard-local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-shipyard-local-secret}
      S3_BUCKET: ${S3_BUCKET:-shipyard-artifacts}
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9333/cluster/status"]
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    image: shipyard-platform:local
    build: .
    command: ["node", "dist/server/api.js"]
    environment:
      <<: *platform-environment
      HOST: 0.0.0.0
      PORT: 3000
      AUTH_USERS: ${AUTH_USERS:-[]}
      SESSION_SECRET: ${SESSION_SECRET:-}
      GITHUB_WEBHOOK_KEY: ${GITHUB_WEBHOOK_KEY:-}
      DASHBOARD_ORIGIN: ${DASHBOARD_ORIGIN:-http://localhost:3000}
      SITE_BASE_URL: ${SITE_BASE_URL:-http://sites.localhost:3000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
    init: true

  worker:
    image: shipyard-platform:local
    build: .
    command: ["node", "dist/server/worker.js"]
    environment: *platform-environment
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
    init: true
    stop_grace_period: 6m

  builder:
    profiles: ["tools"]
    image: shipyard-builder:local
    build: ./docker/builder

volumes:
  postgres-data:
  redis-data:
  storage-data:
